<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fileshare — upload</title>
<link rel="stylesheet" href="/style.css">
<style>
  #dropzone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 2.5rem 1rem;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s, background .15s;
    -webkit-tap-highlight-color: transparent;
  }
  #dropzone.over { border-color: var(--accent); background: rgba(79, 140, 255, 0.07); color: var(--text); }
  #dropzone strong { color: var(--text); }
  #dropzone .dz-icon { font-size: 1.6rem; display: block; margin-bottom: 0.4rem; }
  .file-info { margin-top: 0.75rem; font-size: 0.9rem; display: none; word-break: break-all; }
  .upload-action { margin-top: 1rem; }
  .upload-action button { width: 100%; }
  .progress-wrap { margin-top: 1rem; display: none; }
  .progress-track {
    height: 12px;
    background: var(--bg);
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), #7db0ff); transition: width .15s linear; }
  .progress-stats { margin-top: 0.5rem; font-size: 0.82rem; color: var(--muted); display: flex; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; }
  .share-row { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.75rem; }
  #session-list { list-style: none; margin: 0; padding: 0; font-size: 0.85rem; }
  #session-list li { padding: 0.5rem 0; border-bottom: 1px solid var(--border); word-break: break-all; }
  #session-list li:last-child { border-bottom: none; }
  #session-list a { color: var(--accent); text-decoration: none; }
  #session-list a:hover { text-decoration: underline; }

  /* options */
  .opt-check { display: flex; align-items: flex-start; gap: 0.6rem; cursor: pointer; margin-bottom: 1rem; }
  .opt-check input[type="checkbox"] { width: 22px; height: 22px; margin-top: 0.1rem; accent-color: var(--accent); flex-shrink: 0; }
  .opt-check .opt-label { font-size: 0.92rem; color: var(--text); }
  .opt-check .opt-sub { font-size: 0.8rem; color: var(--muted); }
  .opt-grid { display: grid; grid-template-columns: 1fr; gap: 0.9rem; }
  #ttl-custom-row { display: none; margin-top: 0.5rem; }
  #ttl-custom-row.show { display: block; }
  @media (min-width: 600px) {
    .share-row { flex-direction: row; }
    .share-row input { flex: 1; }
    .upload-action { text-align: right; }
    .upload-action button { width: auto; }
    .opt-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/upload"><span class="dot"></span>fileshare</a>
    <nav class="nav">
      <a href="/upload" class="active">Upload</a>
      <a href="/download">Download</a>
      <a href="/admin">Admin</a>
    </nav>
  </div>
</header>

<main>
  <h1 class="page-title">Share a file</h1>
  <p class="sub">Uploads up to 50 GB supported.</p>

  <div class="panel">
    <label for="key">Upload key (master or temporary)</label>
    <input type="password" id="key" class="mono" autocomplete="off" placeholder="paste an upload key">
    <p class="hint">The key is remembered in this browser (localStorage).</p>
  </div>

  <div class="panel">
    <div id="dropzone">
      <span class="dz-icon">⬆</span>
      <p><strong>Drag &amp; drop a file here</strong></p>
      <p>or tap to choose a file</p>
      <input type="file" id="file" hidden>
    </div>
    <p class="file-info" id="file-info"></p>

    <div class="panel" style="background: var(--panel-2); margin-top: 1rem; margin-bottom: 0;">
      <p class="panel-title">Retention</p>

      <label class="opt-check" for="opt-reboot">
        <input type="checkbox" id="opt-reboot" checked>
        <span>
          <span class="opt-label">Delete when the server restarts</span><br>
          <span class="opt-sub">The file is wiped on reboot/restart. On by default.</span>
        </span>
      </label>

      <div class="opt-grid">
        <div>
          <label for="opt-ttl">Keep the file for</label>
          <select id="opt-ttl">
            <option value="0">Forever</option>
            <option value="15">15 minutes</option>
            <option value="60">1 hour</option>
            <option value="1440">1 day</option>
            <option value="10080">7 days</option>
            <option value="custom">Custom…</option>
          </select>
          <div id="ttl-custom-row">
            <input type="number" id="opt-ttl-custom" min="1" max="525600" inputmode="numeric" placeholder="minutes">
          </div>
        </div>
        <div>
          <label for="opt-maxdl">Remove after N downloads</label>
          <input type="number" id="opt-maxdl" min="0" max="1000000" inputmode="numeric" placeholder="0 = unlimited">
        </div>
      </div>
    </div>

    <div class="upload-action">
      <button id="upload-btn" disabled>Upload</button>
    </div>

    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
      <div class="progress-stats">
        <span id="stat-pct">0%</span>
        <span id="stat-speed">—</span>
        <span id="stat-eta">—</span>
      </div>
    </div>

    <div class="msg" id="msg"></div>

    <div class="share-row" id="share-row" style="display:none;">
      <input type="text" id="share-link" class="mono" readonly>
      <button id="copy-btn" type="button">Copy link</button>
    </div>
  </div>

  <div class="panel" id="session-panel" style="display:none;">
    <p class="panel-title">Uploaded this session</p>
    <ul id="session-list"></ul>
  </div>
</main>

<script>
(function () {
  'use strict';

  var keyInput = document.getElementById('key');
  var fileInput = document.getElementById('file');
  var dropzone = document.getElementById('dropzone');
  var fileInfo = document.getElementById('file-info');
  var uploadBtn = document.getElementById('upload-btn');
  var progressWrap = document.getElementById('progress-wrap');
  var progressBar = document.getElementById('progress-bar');
  var statPct = document.getElementById('stat-pct');
  var statSpeed = document.getElementById('stat-speed');
  var statEta = document.getElementById('stat-eta');
  var msg = document.getElementById('msg');
  var shareRow = document.getElementById('share-row');
  var shareLink = document.getElementById('share-link');
  var copyBtn = document.getElementById('copy-btn');
  var sessionPanel = document.getElementById('session-panel');
  var sessionList = document.getElementById('session-list');
  var optReboot = document.getElementById('opt-reboot');
  var optTtl = document.getElementById('opt-ttl');
  var optTtlCustomRow = document.getElementById('ttl-custom-row');
  var optTtlCustom = document.getElementById('opt-ttl-custom');
  var optMaxDl = document.getElementById('opt-maxdl');

  var selectedFile = null;
  var uploading = false;

  // --- server-side defaults for the options form ------------------------------
  fetch('/api/upload-defaults').then(function (r) { return r.json(); }).then(function (d) {
    optReboot.checked = !!d.deleteOnReboot;
    if (d.ttlMinutes > 0) {
      var match = Array.prototype.find.call(optTtl.options, function (o) { return o.value === String(d.ttlMinutes); });
      if (match) { optTtl.value = match.value; }
      else { optTtl.value = 'custom'; optTtlCustom.value = d.ttlMinutes; }
      syncTtlCustom();
    }
    if (d.maxDownloads > 0) optMaxDl.value = d.maxDownloads;
  }).catch(function () { /* defaults are fine */ });

  optTtl.addEventListener('change', syncTtlCustom);
  function syncTtlCustom() {
    optTtlCustomRow.classList.toggle('show', optTtl.value === 'custom');
  }

  function ttlMinutes() {
    if (optTtl.value === 'custom') {
      var v = parseInt(optTtlCustom.value, 10);
      return (Number.isInteger(v) && v > 0) ? v : 0;
    }
    return parseInt(optTtl.value, 10) || 0;
  }

  // --- key persistence -----------------------------------------------------
  try {
    var saved = localStorage.getItem('fileshare.uploadKey');
    if (saved) keyInput.value = saved;
  } catch (e) { /* storage unavailable */ }

  keyInput.addEventListener('input', function () {
    try { localStorage.setItem('fileshare.uploadKey', keyInput.value); } catch (e) { /* ignore */ }
    refresh();
  });

  // --- file selection --------------------------------------------------------
  dropzone.addEventListener('click', function () { if (!uploading) fileInput.click(); });
  fileInput.addEventListener('change', function () {
    if (fileInput.files.length) selectFile(fileInput.files[0]);
  });

  ['dragenter', 'dragover'].forEach(function (ev) {
    dropzone.addEventListener(ev, function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (!uploading) dropzone.classList.add('over');
    });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    dropzone.addEventListener(ev, function (e) {
      e.preventDefault();
      e.stopPropagation();
      dropzone.classList.remove('over');
    });
  });
  dropzone.addEventListener('drop', function (e) {
    if (uploading) return;
    var files = e.dataTransfer && e.dataTransfer.files;
    if (files && files.length) selectFile(files[0]);
  });

  function selectFile(f) {
    selectedFile = f;
    fileInfo.style.display = 'block';
    fileInfo.textContent = f.name + ' — ' + humanSize(f.size);
    clearMsg();
    refresh();
  }

  function refresh() {
    uploadBtn.disabled = uploading || !selectedFile || keyInput.value.trim().length === 0;
  }

  // --- helpers ---------------------------------------------------------------
  function humanSize(bytes) {
    if (!isFinite(bytes)) return '?';
    var units = ['B', 'KB', 'MB', 'GB', 'TB'];
    var i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
  }

  function fmtEta(seconds) {
    if (!isFinite(seconds) || seconds < 0) return '—';
    if (seconds < 60) return Math.ceil(seconds) + 's';
    if (seconds < 3600) return Math.floor(seconds / 60) + 'm ' + Math.ceil(seconds % 60) + 's';
    return Math.floor(seconds / 3600) + 'h ' + Math.floor((seconds % 3600) / 60) + 'm';
  }

  function showMsg(kind, text) {
    msg.className = 'msg ' + kind;
    msg.textContent = text;
  }
  function clearMsg() { msg.className = 'msg'; msg.textContent = ''; }

  // --- upload ------------------------------------------------------------------
  uploadBtn.addEventListener('click', function () {
    if (!selectedFile || uploading) return;
    var key = keyInput.value.trim();
    if (!key) { showMsg('err', 'Enter an upload key first.'); return; }

    uploading = true;
    refresh();
    clearMsg();
    shareRow.style.display = 'none';
    progressWrap.style.display = 'block';
    progressBar.style.width = '0%';
    statPct.textContent = '0%';
    statSpeed.textContent = '—';
    statEta.textContent = 'ETA —';

    var fd = new FormData();
    // Retention fields first — the server reads them before/at finish.
    fd.append('deleteOnReboot', optReboot.checked ? '1' : '0');
    fd.append('ttlMinutes', String(ttlMinutes()));
    var maxDl = parseInt(optMaxDl.value, 10);
    fd.append('maxDownloads', (Number.isInteger(maxDl) && maxDl > 0) ? String(maxDl) : '0');
    fd.append('file', selectedFile, selectedFile.name);

    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload');
    xhr.setRequestHeader('x-upload-key', key);
    xhr.timeout = 0; // never time out large uploads

    var startTime = Date.now();
    var lastLoaded = 0;
    var lastTime = startTime;
    var smoothedSpeed = 0;

    xhr.upload.onprogress = function (e) {
      if (!e.lengthComputable) return;
      var now = Date.now();
      var dt = (now - lastTime) / 1000;
      if (dt > 0.2) {
        var inst = (e.loaded - lastLoaded) / dt; // bytes/sec
        smoothedSpeed = smoothedSpeed === 0 ? inst : smoothedSpeed * 0.7 + inst * 0.3;
        lastLoaded = e.loaded;
        lastTime = now;
      }
      var pct = (e.loaded / e.total) * 100;
      progressBar.style.width = pct.toFixed(1) + '%';
      statPct.textContent = pct.toFixed(1) + '% (' + humanSize(e.loaded) + ' / ' + humanSize(e.total) + ')';
      statSpeed.textContent = humanSize(smoothedSpeed) + '/s';
      var remaining = (e.total - e.loaded) / (smoothedSpeed || 1);
      statEta.textContent = 'ETA ' + fmtEta(remaining);
    };

    xhr.onload = function () {
      uploading = false;
      refresh();
      var body = null;
      try { body = JSON.parse(xhr.responseText); } catch (e) { /* non-JSON */ }
      if (xhr.status >= 200 && xhr.status < 300 && body && body.id) {
        progressBar.style.width = '100%';
        statPct.textContent = '100%';
        statEta.textContent = 'done';
        var url = location.origin + body.url;
        showMsg('ok', 'Upload complete: ' + body.name + ' (' + humanSize(body.size) + ')');
        shareLink.value = url;
        shareRow.style.display = 'flex';
        addSessionItem(body.name, url);
      } else {
        showMsg('err', (body && body.error) ? body.error : ('Upload failed (HTTP ' + xhr.status + ')'));
      }
    };

    xhr.onerror = function () {
      uploading = false;
      refresh();
      showMsg('err', 'Network error — the upload was interrupted.');
    };

    xhr.ontimeout = function () {
      uploading = false;
      refresh();
      showMsg('err', 'Upload timed out.');
    };

    xhr.send(fd);
  });

  copyBtn.addEventListener('click', function () {
    shareLink.select();
    shareLink.setSelectionRange(0, shareLink.value.length);
    var done = function () {
      copyBtn.textContent = 'Copied';
      setTimeout(function () { copyBtn.textContent = 'Copy link'; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(shareLink.value).then(done, function () { document.execCommand('copy'); done(); });
    } else {
      document.execCommand('copy');
      done();
    }
  });

  function addSessionItem(name, url) {
    sessionPanel.style.display = 'block';
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = url;
    a.textContent = name;
    li.appendChild(a);
    li.appendChild(document.createTextNode(' — ' + url));
    sessionList.insertBefore(li, sessionList.firstChild);
  }
})();
</script>
</body>
</html>
